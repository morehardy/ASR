[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "echoalign-asr-mlx"
dynamic = ["version"]
description = "Local CLI for extracting subtitles and aligned timestamps from audio and video."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
  { name = "morehardy" },
]
keywords = [
  "apple-silicon",
  "asr",
  "automatic-speech-recognition",
  "forced-alignment",
  "mlx",
  "qwen3",
  "speech-recognition",
  "srt",
  "subtitles",
  "transcription",
  "webvtt",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=14.0,<15.0",
  "typer>=0.16,<1.0",
]

[project.optional-dependencies]
mlx = [
  "mlx-audio>=0.3.1",
  "silero-vad>=6.2.1,<7",
  "torchcodec>=0.11.1",
]

[project.scripts]
easr = "asr.cli:main"

[project.urls]
Homepage = "https://github.com/morehardy/echoalign-asr-mlx"
Repository = "https://github.com/morehardy/echoalign-asr-mlx"
Issues = "https://github.com/morehardy/echoalign-asr-mlx/issues"
Changelog = "https://github.com/morehardy/echoalign-asr-mlx/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/morehardy/echoalign-asr-mlx/blob/main/ROADMAP.md"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/asr"]
